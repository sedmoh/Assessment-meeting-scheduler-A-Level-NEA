{% extends "base.html" %}
{% block title %}Select Tutor to Manage{% endblock %}
{% block content %}
<h2>Select Tutor to Manage</h2>

<div class="row">
    {% for tutor in tutors %}
    <div class="col-md-4 mb-3">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ tutor.name }}</h5>
                <p class="card-text">
                    <strong>Email:</strong> {{ tutor.email }}<br>
                    <strong>Role:</strong> {{ tutor.role|title }}
                </p>
                <a href="{{ url_for('manage_tutor', tutor_id=tutor.user_id) }}" 
                   class="btn btn-primary">Manage Schedule</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<div class="mt-3">
    <a href="{{ url_for("dashboard") }}" class="btn btn-secondary">Back to Dashboard</a>
</div>
{% endblock %}
