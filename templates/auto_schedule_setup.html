{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Auto-schedule</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="days">Please enter the number of days:</label>
            <input 
                type="number" 
                id="days" 
                name="number_of_days" 
                class="form-control" 
                min="1" 
                max="30" 
                required>
        </div>
        <button type="submit" class="btn btn-primary">Find Slot</button>
    </form>
{% endblock %}
